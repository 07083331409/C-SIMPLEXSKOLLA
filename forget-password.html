<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password | SIMPLEXSKOLLA</title>

<link rel="stylesheet" href="css/forgot-password.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
    /* ==========================================
   SIMPLEXSKOLLA
   Forgot Password
========================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    font-family:'Poppins',sans-serif;

    background:#05051F;

    color:#fff;

    overflow-x:hidden;

    min-height:100dvh;

}

.container{

    min-height:100dvh;

    display:grid;

    grid-template-columns:42% 58%;

    background:
    radial-gradient(circle at top left,#2563eb20,transparent 35%),
    radial-gradient(circle at bottom right,#d4af3712,transparent 40%),
    #05051F;

}


/* ==========================================
   LEFT PANEL
========================================== */

.left-panel{

    padding:70px 60px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    position:relative;

}

.logo{

    display:flex;

    align-items:center;

    gap:18px;

    margin-bottom:40px;

}

.logo img{

    width:70px;

    height:70px;

    object-fit:contain;

    background:#2563EB;

    border-radius:18px;

    padding:10px;

    box-shadow:0 15px 35px rgba(37,99,235,.35);

}

.logo h2{

    font-size:30px;

    font-weight:700;

}

.logo p{

    color:#94A3B8;

    margin-top:5px;

    font-size:14px;

}

.badge{

    width:max-content;

    padding:10px 18px;

    border-radius:50px;

    background:rgba(37,99,235,.18);

    border:1px solid rgba(37,99,235,.35);

    color:#7FB3FF;

    margin-bottom:30px;

}

.left-panel h1{

    font-size:54px;

    margin-bottom:20px;

    line-height:1.2;

}

.left-panel p{

    color:#AAB2C8;

    font-size:17px;

    line-height:1.8;

    max-width:520px;

}
/* ==========================================
   RIGHT PANEL
========================================== */

.right-panel{

    display:flex;

    justify-content:center;

    align-items:center;

    padding:60px;

}


/* ==========================================
   FORGOT PASSWORD CARD
========================================== */

.forgot-card{

    width:100%;

    max-width:520px;

    padding:45px;

    border-radius:28px;

    background:rgba(255,255,255,.06);

    backdrop-filter:blur(18px);

    -webkit-backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.08);

    box-shadow:
    0 20px 60px rgba(0,0,0,.35),
    0 0 80px rgba(37,99,235,.08);

    animation:fadeIn .8s ease;

}

.forgot-card h2{

    font-size:36px;

    margin-bottom:10px;

}

.forgot-card p{

    color:#AAB2C8;

    margin-bottom:35px;

    line-height:1.7;

}


/* ==========================================
   INPUTS
========================================== */

.input-group{

    margin-bottom:25px;

}

.input-group label{

    display:block;

    margin-bottom:10px;

    color:#E2E8F0;

    font-size:14px;

    font-weight:500;

}

.input-group input{

    width:100%;

    height:60px;

    padding:0 18px;

    border-radius:14px;

    border:1px solid rgba(255,255,255,.08);

    background:#0F172A;

    color:#fff;

    font-size:15px;

    outline:none;

    transition:.3s;

}

.input-group input::placeholder{

    color:#64748B;

}

.input-group input:focus{

    border-color:#2563EB;

    box-shadow:0 0 0 4px rgba(37,99,235,.15);

}


/* ==========================================
   BUTTON
========================================== */

button{

    width:100%;

    height:60px;

    border:none;

    border-radius:16px;

    background:linear-gradient(135deg,#2563EB,#4F46E5);

    color:#fff;

    font-size:17px;

    font-weight:600;

    cursor:pointer;

    transition:.35s ease;

    box-shadow:0 15px 35px rgba(37,99,235,.30);

}

button:hover{

    transform:translateY(-3px);

    box-shadow:0 22px 45px rgba(37,99,235,.45);

}

button:active{

    transform:scale(.98);

}


/* ==========================================
   BOTTOM LINKS
========================================== */

.bottom-links{

    margin-top:28px;

    text-align:center;

}

.bottom-links a{

    color:#D4AF37;

    text-decoration:none;

    font-weight:600;

    transition:.3s;

}

.bottom-links a:hover{

    color:#FFD54A;

}


/* ==========================================
   GLOW EFFECTS
========================================== */

.left-panel::before{

    content:"";

    position:absolute;

    width:320px;

    height:320px;

    background:#2563EB;

    border-radius:50%;

    filter:blur(140px);

    opacity:.18;

    top:-90px;

    left:-120px;

}

.left-panel::after{

    content:"";

    position:absolute;

    width:240px;

    height:240px;

    background:#D4AF37;

    border-radius:50%;

    filter:blur(140px);

    opacity:.10;

    bottom:-80px;

    right:-50px;

}

.left-panel>*{

    position:relative;

    z-index:2;

}


/* ==========================================
   ANIMATIONS
========================================== */

.left-panel{

    animation:slideLeft .8s ease;

}

@keyframes fadeIn{

    from{

        opacity:0;

        transform:translateY(25px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}

@keyframes slideLeft{

    from{

        opacity:0;

        transform:translateX(-35px);

    }

    to{

        opacity:1;

        transform:translateX(0);

    }

}


/* ==========================================
   RESPONSIVE
========================================== */

@media(max-width:1100px){

    .container{

        grid-template-columns:1fr;

    }

    .left-panel{

        display:none;

    }

    .right-panel{

        padding:30px 20px;

    }

}

@media(max-width:768px){

    .forgot-card{

        padding:32px 24px;

        border-radius:22px;

    }

    .forgot-card h2{

        font-size:30px;

    }

}

@media(max-width:480px){

    .forgot-card{

        padding:25px 18px;

    }

    .forgot-card h2{

        font-size:26px;

    }

    button{

        height:55px;

        font-size:16px;

    }

}


/* ==========================================
   SCROLLBAR
========================================== */

::-webkit-scrollbar{

    width:10px;

}

::-webkit-scrollbar-track{

    background:#05051F;

}

::-webkit-scrollbar-thumb{

    background:#2563EB;

    border-radius:50px;

}

::-webkit-scrollbar-thumb:hover{

    background:#4F46E5;

}
</style>
</head>

<body>

<div class="container">

    <!-- LEFT SIDE -->

    <div class="left-panel">

        <div class="logo">

            <img src="assets/images/logo.png">

            <div>

                <h2>SIMPLEXSKOLLA</h2>

                <p>School ERP Platform</p>

            </div>

        </div>

        <span class="badge">

            Secure Password Recovery

        </span>

        <h1>

            Forgot Your Password?

        </h1>

        <p>

            Don't worry.

            Enter the email address associated with your account.

            We'll send you a secure password reset link.

        </p>

    </div>

    <!-- RIGHT SIDE -->

    <div class="right-panel">

        <div class="forgot-card">

            <h2>Reset Password</h2>

            <p>

                Enter your registered email address.

            </p>

            <form>

                <div class="input-group">

                    <label>Email Address</label>

                    <input
                    type="email"
                    placeholder="Enter your email">

                </div>

                <button>

                    Send Reset Link

                </button>
                <p class="form-message" style="margin-top: 16px; font-size: 14px; color: #F87171;"></p>
            </form>

            <div class="bottom-links">

                <a href="login.html">

                    ← Back to Login

                </a>

            </div>

        </div>

    </div>

</div>

<script type="module" src="js/forgot-password.js"></script>

</body>

</html>
